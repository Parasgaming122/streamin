<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CineStream</h1>
        <input type="text" id="search" placeholder="Search for movies and TV shows...">
    </header>

    <main>
        <section id="popular-movies">
            <h2>Popular Movies</h2>
            <div class="carousel-container">
                </div>
        </section>

        <section id="popular-tv-shows">
            <h2>Popular TV Shows</h2>
            <div class="carousel-container">
                </div>
        </section>

        <section id="search-results" style="display: none;">
            <h2>Search Results</h2>
            <div class="results-grid">
                </div>
        </section>

        <section id="details" style="display: none;">
            <div class="details-container">
                <img id="details-poster" src="" alt="Poster">
                <div class="details-info">
                    <h2 id="details-title"></h2>
                    <p id="details-overview"></p>
                    <p><strong>Rating:</strong> <span id="details-rating"></span></p>
                    <div class="player-options">
                        <button id="player-regular">Regular Player</button>
                        <button id="player-vip">VIP Player</button>
                    </div>
                    <iframe id="video-player" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 CineStream. Powered by TMDB.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
